{% set name = "typogrify" %}
{% set version = "2.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f0aa004e98032a6e6be4c9da65e7eb7150e36ca3bf508adbcda82b4d003e61ee

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - smartypants >=1.8.3

test:
  source_files:
    - typogrify/packages/titlecase/__init__.py
    - typogrify/packages/titlecase/tests.py
  imports:
    - typogrify
    - typogrify.filters
    - typogrify.packages
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -ra -vv typogrify/packages/titlecase/tests.py

about:
  home: hhttps://github.com/justinmayer/typogrify
  summary: Filters to enhance web typography, including support for Django & Jinja templates
  description: |
    Typogrify provides a set of custom filters that automatically apply various
    transformations to plain text in order to yield typographically-improved
    HTML. While often used in conjunction with Jinja and Django template systems,
    the filters can be used in any environment.
  license: BSD-3-Clause
  license_family: BSD
  doc_url: https://github.com/justinmayer/typogrify
  dev_url: https://github.com/justinmayer/typogrify

extra:
  recipe-maintainers:
    - pmlandwehr
    - ickc
